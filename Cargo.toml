[package]
name = "video-analyzer"
version = "0.5.0"
edition = "2021"
authors = ["kira"]
description = "FLV 视频文件分析工具 - WASM 库"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
# 更好的 WASM panic 信息
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
debug = false
opt-level = "s"
lto = true

# 关键：强制保留 DWARF 调试信息 (仅限 Dev)
[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true
